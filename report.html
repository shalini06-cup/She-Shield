<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Report Incident</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <nav>

        <a href="/">Home</a> |

        <a href="/report">Report Incident</a> |

        <a href="/contacts">Emergency Contacts</a> |

        <a href="/tips">Safety Tips</a> |

        <a href="/history">Report History</a>

    </nav>


    <h1>Report an Incident</h1>
    <p>
Report women's safety issues, accidents, harassment,
streetlight problems, or other public safety concerns.
</p>


    <form method="POST">

        <br>

        <input
        type="text"
        name="location"
        placeholder="Enter Location"
        required>

        <br><br>

        <input
        type="text"
        name="issue"
        placeholder="Describe Issue"
        required>

        <br><br>

        <button type="submit" class="main-btn">

            Submit Report

        </button>

    </form>


    <br>


    <!-- EMERGENCY ALARM BUTTON -->

    <button
    onclick="playAlarm()"
    class="alarm-btn">

        Emergency Alarm

    </button>


    <footer>

        <p>
            © 2026 SheShield
        </p>

    </footer>


    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
