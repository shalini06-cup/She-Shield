<!DOCTYPE html>
<html>

<head>

    <title>Report History</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

</head>

<body>
    


    <h1>Report History</h1>

    <table border="1" cellpadding="10">

        <tr>

            <th>ID</th>
            <th>Location</th>
            <th>Issue</th>
            <th>Time</th>

        </tr>

        {% for report in reports %}

        <tr>

            <td>{{ report[0] }}</td>
            <td>{{ report[1] }}</td>
            <td>{{ report[2] }}</td>
            <td>{{ report[3] }}</td>

        </tr>

        {% endfor %}

    </table>

</body>
</html>
